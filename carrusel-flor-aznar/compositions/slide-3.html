<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1080px; overflow: hidden; background: #7c2d12; }
  </style>
</head>
<body>
<div id="root"
     data-composition-id="slide-3"
     data-width="1080"
     data-height="1080"
     style="width:1080px;height:1080px;position:relative;overflow:hidden;
            background:linear-gradient(160deg,#7c2d12 0%,#9a3412 60%,#b5541a 100%);
            font-family:'Manrope',sans-serif;">

  <!-- Radial glow -->
  <div style="position:absolute;inset:0;pointer-events:none;
              background:radial-gradient(ellipse at 40% 60%,rgba(255,210,180,0.12) 0%,transparent 65%);"></div>

  <!-- Circulo decorativo top-right -->
  <div style="position:absolute;top:-120px;right:-120px;
              width:400px;height:400px;border-radius:50%;pointer-events:none;
              border:1px solid rgba(253,246,240,0.1);"></div>
  <div style="position:absolute;top:-60px;right:-60px;
              width:280px;height:280px;border-radius:50%;pointer-events:none;
              border:1px solid rgba(253,246,240,0.08);"></div>

  <!-- Logo -->
  <div id="logo" class="clip"
       data-start="0" data-duration="4" data-track-index="0"
       style="position:absolute;top:64px;left:72px;
              font-family:'Manrope',sans-serif;font-weight:300;
              letter-spacing:0.22em;text-transform:uppercase;
              font-size:18px;color:rgba(253,246,240,0.7);">
    Flor Aznar
  </div>

  <!-- Titulo CTA -->
  <div id="cta-title" class="clip"
       data-start="0" data-duration="4" data-track-index="1"
       style="position:absolute;top:50%;left:72px;right:72px;
              transform:translateY(-58%);text-align:center;">
    <h2 style="font-family:'Playfair Display',serif;font-weight:400;
               font-size:82px;line-height:1.1;color:#fdf6f0;letter-spacing:-0.01em;">
      Iniciamos la<br><em>conversacion?</em>
    </h2>
  </div>

  <!-- Subtitulo -->
  <div id="subtitle" class="clip"
       data-start="0" data-duration="4" data-track-index="2"
       style="position:absolute;top:50%;left:72px;right:72px;
              transform:translateY(70%);text-align:center;">
    <p style="font-family:'Manrope',sans-serif;font-size:20px;
              font-weight:300;color:rgba(253,246,240,0.65);line-height:1.65;">
      Toda evolucion comienza con una sola pregunta.
    </p>
  </div>

  <!-- Boton WhatsApp -->
  <div id="btn" class="clip"
       data-start="0" data-duration="4" data-track-index="3"
       style="position:absolute;bottom:165px;left:50%;transform:translateX(-50%);">
    <div style="background:#fdf6f0;border-radius:999px;
                padding:20px 56px;display:inline-block;">
      <span style="font-family:'Manrope',sans-serif;font-weight:700;
                   font-size:18px;color:#7c2d12;letter-spacing:0.02em;">
        Escribime por WhatsApp
      </span>
    </div>
  </div>

  <!-- Instagram handle -->
  <div id="handle" class="clip"
       data-start="0" data-duration="4" data-track-index="4"
       style="position:absolute;bottom:95px;left:50%;transform:translateX(-50%);
              white-space:nowrap;">
    <span style="font-family:'Manrope',sans-serif;font-size:14px;
                 letter-spacing:0.3em;text-transform:uppercase;
                 font-weight:500;color:rgba(253,246,240,0.5);">
      @metodo_rap
    </span>
  </div>

  <!-- Linea separadora sobre handle -->
  <div id="divider" class="clip"
       data-start="0" data-duration="4" data-track-index="5"
       style="position:absolute;bottom:130px;left:50%;transform:translateX(-50%);
              width:40px;height:1px;background:rgba(253,246,240,0.25);"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from("#logo",      { y: -20, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.1)
      .from("#cta-title", { y: 50,  opacity: 0, duration: 1.0, ease: "power3.out" }, 0.3)
      .from("#subtitle",  { y: 30,  opacity: 0, duration: 0.8, ease: "power2.out" }, 0.9)
      .from("#btn",       { y: 30,  opacity: 0, duration: 0.8, ease: "back.out(1.5)" }, 1.2)
      .from("#divider",   { scaleX: 0, opacity: 0, duration: 0.5 }, 1.7)
      .from("#handle",    { y: 15,  opacity: 0, duration: 0.6, ease: "power2.out" }, 1.8);
    window.__timelines = window.__timelines || {};
    window.__timelines["slide-3"] = tl;
  </script>
</div>
</body>
</html>
